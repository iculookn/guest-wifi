<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>You're online · Guest Wi-Fi</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root {
    --ink: #0B3C5D;
    --text: #3D5568;
    --teal: #0A7E8C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0B4F6C url("bg.jpg") center bottom / cover no-repeat fixed;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 28px;
    padding: 40px 32px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(4, 30, 48, 0.35);
    animation: rise 0.6s ease-out both;
  }
  .logo { width: 88px; height: 88px; display: block; margin: 0 auto 12px; }
  .tick {
    width: 56px; height: 56px; margin: -8px auto 16px;
    border-radius: 50%; background: var(--teal);
    display: flex; align-items: center; justify-content: center;
    animation: pop 0.5s 0.35s ease-out both;
  }
  .tick svg { width: 30px; height: 30px; }
  h1 {
    margin: 0 0 12px;
    color: var(--ink);
    font-size: clamp(2.1rem, 8vw, 2.8rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  p { margin: 0 0 10px; font-size: 1.15rem; line-height: 1.5; }
  .lead { font-size: 1.3rem; color: var(--ink); font-weight: 600; }
  .zh { margin-top: 14px; font-size: 1.1rem; color: var(--teal); }
  footer {
    margin-top: 24px; padding-top: 16px;
    border-top: 1px solid rgba(11, 60, 93, 0.12);
    font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; color: #6B8293;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card, .tick { animation: none; } }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="">
    <div class="tick" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1>You're online</h1>
    <p class="lead">Welcome, and have fun!</p>
    <p>Got another phone or laptop? Enter the same code on it.</p>
    <p class="zh" lang="zh-Hans">已连接，祝你玩得开心！</p>
    <footer>Guest Wi-Fi</footer>
  </main>
</body>
</html>
